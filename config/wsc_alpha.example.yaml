    max_position_pct_nav: TBD
    max_idea_risk_pct: TBD
  market_beta:
    target_range: TBD  # reasoned starting point discussed separately; not copied here as if proven
    hard_stop: TBD
  sector_beta:
    target_range: TBD
    hard_stop: TBD
  drawdown_limit:
    soft_pct: TBD
    reduce_risk_pct: TBD
    hard_stop_pct: TBD
    # UNKNOWN: all drawdown thresholds require calibration against a real
